name: taskhub

x-app: &app
  build: .
  image: taskhub:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://taskhub:taskhub@db:5432/taskhub}
    TEST_DATABASE_URL: postgresql+psycopg://taskhub:taskhub@db:5432/taskhub_test
    MIGCHECK_DATABASE_URL: postgresql+psycopg://taskhub:taskhub@db:5432/taskhub_migcheck
    HOME: /tmp
  # Source is bind-mounted everywhere so migrate/api/tools always run the working tree,
  # never stale code baked into the image (rebuild only when dependencies change).
  volumes:
    - ./:/app
  # Run as the host user so files written into the bind mount (caches, logs) stay editable.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub
      POSTGRES_DB: taskhub
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  tools:
    <<: *app
    profiles: ["tools"]
    command: ["bash"]

  agent:
    # Sandboxed Claude Code for autonomous loops (Stage 7). Only the loop's sandbox clone is
    # mounted: no docker socket, no host home directory, no other repos. It reaches Postgres
    # over the compose network and runs tools directly (IN_CONTAINER=1 in the Makefile).
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: taskhub-agent:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IN_CONTAINER: "1"
      HOME: /tmp/agent-home
      DATABASE_URL: postgresql+psycopg://taskhub:taskhub@db:5432/taskhub
      TEST_DATABASE_URL: postgresql+psycopg://taskhub:taskhub@db:5432/taskhub_test
      MIGCHECK_DATABASE_URL: postgresql+psycopg://taskhub:taskhub@db:5432/taskhub_migcheck
      HARNESS_STOP_CHECK: make check
    volumes:
      - ${GOAL_SANDBOX:-./.worktrees/none}:/work
    working_dir: /work
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
